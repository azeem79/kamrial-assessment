# 🟢 4. Security is generally good

The repository has a dedicated security document.

It demonstrates:

**Internet**

→ ALB

→ ECS private subnet

→ RDS private subnet

and restricts:

```text
ALB → App : 8000
App → DB : 5432
```

It also uses AWS Secrets Manager for the RDS master password and does not commit credentials.

That is aligned well with the assessment's security requirements for identity, least privilege, secrets, network exposure and database access.

### One limitation

Your security document explicitly says CloudTrail and VPC Flow Logs are **deferred** rather than provisioned.

The assessment asks for logging/auditing of important actions.

So I would mark this **mostly fulfilled**, rather than 100%.

